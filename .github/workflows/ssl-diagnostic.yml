name: SnapSpace Pages reset verify

on:
  push:
    branches:
      - test/pages-rebuild-20260916

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for reset build
        run: sleep 45
      - name: Verify Pages reset state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/pages || true
          gh api repos/${GITHUB_REPOSITORY}/pages/builds/latest || true
