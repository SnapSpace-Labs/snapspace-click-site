name: SnapSpace SSL diagnostic

on:
  push:
    branches:
      - test/pages-rebuild-20260916

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages API state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/pages || true
      - name: TLS state
        shell: bash
        run: |
          set -u
          DOMAIN="snapspace.click"
          echo "A:"; dig +short "$DOMAIN" A || true
          timeout 20 openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" -showcerts </dev/null 2>/tmp/tls.err | awk '/BEGIN CERTIFICATE/{flag=1} flag{print} /END CERTIFICATE/{exit}' > /tmp/leaf.pem || true
          cat /tmp/tls.err || true
          if grep -q 'BEGIN CERTIFICATE' /tmp/leaf.pem; then openssl x509 -in /tmp/leaf.pem -noout -subject -issuer -dates -ext subjectAltName || true; fi
